{ emoji:"🌾", titleEn:"SIDH — Rural Advantage", titleMr:"SIDH — ग्रामीण फायदा",

    <li><strong>₹9,000/month stipend</strong> (Government + company contribution).[reference:25]</li>

/* ============================================================
   RENDER SLIDES
   ============================================================ */
const deck = document.getElementById('deck');
slides.forEach((s, i) => {
  const div = document.createElement('section');
  div.className = 'slide' + (i === 0 ? ' active' : '');
  div.setAttribute('aria-hidden', i === 0 ? 'false' : 'true');
  div.innerHTML = `
    <div class="emoji">${s.emoji || '📌'}</div>
    <h1>${s.titleEn}</h1>
    <h2>${s.titleMr}</h2>
    <div style="width:100%;max-width:1000px;">${s.bodyEn || ''}</div>
  `;
  deck.appendChild(div);
});

/* ============================================================
   NAVIGATION
   ============================================================ */
let current = 0;
const total = slides.length;
const slideEls = document.querySelectorAll('.slide');
const counter = document.getElementById('counter');
const progressBar = document.getElementById('progress-bar');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

function showSlide(index) {
  if (index < 0 || index >= total) return;
  slideEls[current].classList.remove('active');
  slideEls[current].setAttribute('aria-hidden', 'true');
  current = index;
  slideEls[current].classList.add('active');
  slideEls[current].setAttribute('aria-hidden', 'false');
  counter.textContent = `${current + 1} / ${total}`;
  progressBar.style.width = ((current + 1) / total * 100) + '%';
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
}

prevBtn.addEventListener('click', () => showSlide(current - 1));
nextBtn.addEventListener('click', () => showSlide(current + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); showSlide(current + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); showSlide(current - 1); }
});

document.getElementById('fullscreen').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});

showSlide(0);
</script>
